<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#020713">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LW Pong">
  <meta name="screen-orientation" content="portrait">
  <meta name="description" content="Lightning vs Wind Pong - arcade game installabile e full screen.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lightning vs Wind Pong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">ARCADE DUEL</span>
        <h1>LIGHTNING <i>VS</i> WIND PONG</h1>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="icon-btn hidden" type="button" aria-label="Installa app" title="Installa app">⬇</button>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Audio" title="Audio">🔊</button>
        <button id="fullBtn" class="icon-btn" type="button" aria-label="Schermo intero" title="Schermo intero">⛶</button>
        <button id="pauseTopBtn" class="icon-btn" type="button" aria-label="Pausa" title="Pausa">⏸</button>
      </div>
    </header>

    <section class="scorebar" aria-label="Punteggio">
      <div class="score score-lightning"><span>LIGHTNING</span><strong id="leftScore">0</strong></div>
      <div class="match"><b>VS</b><small id="matchInfo">FIRST TO 10</small></div>
      <div class="score score-wind"><span>WIND</span><strong id="rightScore">0</strong></div>
    </section>

    <section class="arena-shell">
      <canvas id="gameCanvas" width="720" height="1120" aria-label="Campo di gioco"></canvas>

      <div id="startOverlay" class="overlay show">
        <div class="panel">
          <div class="panel-kicker">PORTRAIT FULL SCREEN</div>
          <h2>PRONTO?</h2>
          <p>Il pulsante <b>↓ a sinistra</b> porta Lightning in basso; il pulsante <b>↑ a destra</b> la porta in alto.</p>
          <div class="mode-row">
            <button id="cpuBtn" class="menu-btn primary" type="button">⚡ 1 GIOCATORE<small>contro CPU</small></button>
            <button id="twoBtn" class="menu-btn" type="button">🌪️ 2 GIOCATORI<small>stesso dispositivo</small></button>
          </div>
          <div class="difficulty">
            <button data-difficulty="easy" type="button">Facile</button>
            <button data-difficulty="normal" class="active" type="button">Media</button>
            <button data-difficulty="hard" type="button">Difficile</button>
          </div>
          <div class="audio-row">
            <button id="musicBtn" class="toggle active" type="button">🎵 MUSICA</button>
            <button id="sfxBtn" class="toggle active" type="button">🔊 EFFETTI</button>
          </div>
          <div class="wins">⚡ <b id="leftWins">0</b> vittorie &nbsp;·&nbsp; 🌪️ <b id="rightWins">0</b> vittorie</div>
        </div>
      </div>

      <div id="pauseOverlay" class="overlay">
        <div class="panel compact">
          <div class="panel-kicker">MATCH IN PAUSA</div>
          <h2>PAUSA</h2>
          <button id="resumeBtn" class="menu-btn primary" type="button">▶ RIPRENDI</button>
          <button id="restartBtn" class="menu-btn" type="button">↻ RICOMINCIA</button>
          <button id="menuBtnPause" class="menu-btn" type="button">☰ MENU</button>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay">
        <div class="panel compact">
          <div class="panel-kicker">DUELLO CONCLUSO</div>
          <h2 id="winnerText">LIGHTNING VINCE!</h2>
          <div id="finalScore" class="final-score">10 - 8</div>
          <button id="rematchBtn" class="menu-btn primary" type="button">⚡ RIVINCITA</button>
          <button id="menuBtn" class="menu-btn" type="button">☰ MENU</button>
        </div>
      </div>
    </section>

    <section class="mobile-controls" aria-label="Controlli racchetta Lightning">
      <button id="downBtn" class="move-btn down-btn" type="button" aria-label="Muovi racchetta in basso">
        <span class="arrow">↓</span><span class="move-label">GIÙ</span>
      </button>
      <button id="upBtn" class="move-btn up-btn" type="button" aria-label="Muovi racchetta in alto">
        <span class="arrow">↑</span><span class="move-label">SU</span>
      </button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
